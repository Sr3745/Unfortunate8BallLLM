<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Unfortunate 8-Ball</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1b1236 0%, #03000a 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Starry cosmic background */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(1px 1px at 10% 10%, white 100%, transparent),
                radial-gradient(1px 1px at 20% 80%, white 100%, transparent),
                radial-gradient(2px 2px at 30% 30%, #e6e6fa 100%, transparent),
                radial-gradient(1px 1px at 40% 70%, white 100%, transparent),
                radial-gradient(1.5px 1.5px at 50% 20%, #d8bfd8 100%, transparent),
                radial-gradient(1px 1px at 60% 90%, white 100%, transparent),
                radial-gradient(2px 2px at 70% 40%, white 100%, transparent),
                radial-gradient(1px 1px at 80% 60%, white 100%, transparent),
                radial-gradient(1.5px 1.5px at 90% 10%, #e6e6fa 100%, transparent);
            background-size: 200px 200px;
            opacity: 0.3;
            z-index: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* The 3D 8-Ball */
        .magic-8-ball {
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 25%, #3a3a45 0%, #0a0a0c 45%, #000000 100%);
            box-shadow: 
                0 25px 50px rgba(0,0,0,0.8), 
                inset -20px -20px 40px rgba(0,0,0,0.9),
                inset 10px 10px 30px rgba(255,255,255,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), filter 1.2s ease;
        }

        /* The Window and Liquid */
        .window {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle at center, #23084f 0%, #06010f 100%);
            border: 5px solid #080808;
            box-shadow: 
                inset 0 0 30px rgba(0,0,0,1), 
                0 0 0 6px #121212, 
                0 0 0 12px #050505, 
                inset 0 0 40px rgba(111, 0, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* The Floating Shape (Starts as Triangle) */
        .shape-wrapper {
            width: 110px;
            height: 110px;
            filter: drop-shadow(0 0 15px rgba(255, 0, 255, 0.8));
            transition: opacity 0.6s ease, transform 0.6s ease;
            animation: float 4s ease-in-out infinite;
        }

        .shape {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #ff55ff 0%, #9900ff 100%);
            /* We use 4 points here so it can perfectly morph into a 4-point square */
            clip-path: polygon(10% 10%, 90% 10%, 50% 90%, 50% 90%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 25px; /* Shifts text up into the wide section */
            transition: clip-path 1s cubic-bezier(0.25, 1, 0.5, 1), padding 1s ease;
        }

        /* Scrollable Text Container */
        .text-container {
            width: 85%;
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            /* Hide scrollbars for a cleaner look */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .text-container::-webkit-scrollbar {
            display: none;
        }

        #response {
            color: #ffffff;
            font-weight: 800;
            text-align: center;
            font-size: 11px;
            line-height: 1.3;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
            word-wrap: break-word;
            opacity: 1;
            transition: opacity 0.4s ease;
            text-transform: uppercase;
            margin: auto;
        }

        /* ZOOMED STATE - Covers the screen & morphs to square */
        .zoomed .magic-8-ball {
            transform: scale(3.6);
            filter: drop-shadow(0 0 60px rgba(255, 0, 255, 0.6));
            cursor: default; /* Remove pointer cursor when zoomed */
        }

        .zoomed .shape {
            /* Morphs the 4 points into a full square! */
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
            padding-bottom: 0px; /* Reset padding to center text perfectly */
        }

        .zoomed .text-container {
            align-items: flex-start; /* Aligns long text to the top for scrolling */
            height: 90%;
            width: 95%;
            padding: 5px;
        }

        .zoomed .controls {
            opacity: 0;
            pointer-events: none;
            transform: translateY(30px);
        }

        .zoomed .reset-prompt {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(2deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-6px, 3px) rotate(-3deg); }
            20%, 40%, 60%, 80% { transform: translate(6px, -3px) rotate(3deg); }
        }

        .shaking {
            animation: shake 0.4s infinite !important;
        }

        .fade-out {
            opacity: 0 !important;
        }

        /* UI Controls Form */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
            background: rgba(18, 15, 28, 0.7);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 40px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 15px;
            background-color: #0d0a17;
            color: white;
            border: 1px solid #322554;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: center;
        }

        input:focus {
            border-color: #ff55ff;
            box-shadow: 0 0 12px rgba(255, 85, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            background: linear-gradient(90deg, #8a00e6, #ff007f);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: filter 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }

        button:hover {
            filter: brightness(1.2);
        }

        button:active {
            transform: scale(0.97);
        }

        /* Overlay text prompting user to reset */
        .reset-prompt {
            position: absolute;
            bottom: 40px;
            color: #ff80ff;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease 0.8s, transform 0.6s ease 0.8s;
            transform: translateY(10px);
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .zoomed .magic-8-ball {
                transform: scale(2.6);
            }
        }
    </style>
</head>
<body id="body">

<div class="stars"></div>

<div class="container" id="container">
    
    <div class="magic-8-ball" id="ball">
        <div class="window">
            <div class="shape-wrapper" id="shape-wrapper">
                <div class="shape">
                    <div class="text-container">
                        <span id="response">ASK<br>ME</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="controls" id="controls">
        <input type="text" id="questionInput" placeholder="Ask a Yes/No question if you dare...">
        <button onclick="askOracle()" id="askBtn">Consult the Void</button>
    </div>
    
    <div class="reset-prompt" onclick="resetOracle()">Click anywhere outside to ask again</div>

</div>

<script>
    let isZoomed = false;

    async function askOracle() {
        const questionInput = document.getElementById("questionInput");
        const questionText = questionInput.value;
        const responseSpan = document.getElementById("response");
        const ball = document.getElementById("ball");
        const shapeWrapper = document.getElementById("shape-wrapper");
        const container = document.getElementById("container");
        const btn = document.getElementById("askBtn");
        
        if (!questionText.trim()) {
            responseSpan.style.fontSize = "11px";
            responseSpan.innerHTML = "TYPE<br>SMTH";
            return;
        }

        // Lock button & trigger shake animation
        btn.disabled = true;
        ball.classList.add("shaking");
        shapeWrapper.classList.add("fade-out");
        
        // Your Poco F1 live Cloudflare API
        const apiUrl = "https://thou-wolf-cooperation-outlined.trycloudflare.com";
        try {
            console.log(`[OUTGOING] Asking the void: "${questionText}"`);
            
            const response = await fetch(`${apiUrl}/ask`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: questionText }),
            });
            
            if (!response.ok) throw new Error("Network response failed");

            const data = await response.json();
            const text = data.fortune;
            
            console.log(`[INCOMING] The 8-Ball replied: "${text}"`);
            
            setTimeout(() => {
                // Stop shaking
                ball.classList.remove("shaking");
                
                // Set text inside the shape
                responseSpan.innerText = text;
                
                // Adjust text size (larger now since we morph to a square)
                if (text.length < 25) {
                    responseSpan.style.fontSize = "13px";
                } else if (text.length < 100) {
                    responseSpan.style.fontSize = "10px";
                } else {
                    responseSpan.style.fontSize = "8px"; // Fully scrollable if it gets this small
                }
                
                // Reveal shape & trigger dramatic zoom and morph
                shapeWrapper.classList.remove("fade-out");
                container.classList.add("zoomed");
                isZoomed = true;
                
            }, 800); 
            
        } catch (error) {
            console.error("[ERROR] Connection to the Poco F1 failed.", error);
            setTimeout(() => {
                ball.classList.remove("shaking");
                responseSpan.style.fontSize = "10px";
                responseSpan.innerHTML = "API<br>OFFLINE";
                shapeWrapper.classList.remove("fade-out");
                btn.disabled = false;
            }, 800);
        }
    }

    function resetOracle() {
        if (!isZoomed) return;
        
        const container = document.getElementById("container");
        const shapeWrapper = document.getElementById("shape-wrapper");
        const responseSpan = document.getElementById("response");
        const questionInput = document.getElementById("questionInput");
        const btn = document.getElementById("askBtn");

        // Zoom back out and morph back to triangle
        container.classList.remove("zoomed");
        isZoomed = false;
        
        setTimeout(() => {
            shapeWrapper.classList.add("fade-out");
            setTimeout(() => {
                responseSpan.style.fontSize = "11px";
                responseSpan.innerHTML = "ASK<br>ME";
                shapeWrapper.classList.remove("fade-out");
                questionInput.value = "";
                btn.disabled = false;
                questionInput.focus();
            }, 300);
        }, 600);
    }

    // Allow pressing 'Enter' to submit
    document.getElementById("questionInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            askOracle();
        }
    });

    // Click background to reset when zoomed (avoids resetting when scrolling text)
    document.getElementById("body").addEventListener("click", function(e) {
        if (isZoomed && !e.target.closest('.window')) {
            resetOracle();
        }
    });
</script>

</body>
</html>
